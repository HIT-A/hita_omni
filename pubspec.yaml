name: hita_omni
description: "A minimal, extensible cross-platform campus assistant for HIT students."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  academic_api:
    path: packages/academic_api
  provider_hit:
    path: packages/provider_hit

  cupertino_icons: ^2.0.0
  http: ^1.6.0
  intl: any
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  web: ^1.1.1
  window_manager: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - path: assets/fonts/Roboto-Regular.ttf
      platforms: [web]
    - path: assets/fonts/DroidSansFallbackFull.ttf
      platforms: [web]
    - path: assets/fonts/roboto/v32/KFOmCnqEu92Fr1Me4GZLCzYlKw.woff2
      platforms: [web]
